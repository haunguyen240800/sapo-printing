[package]
name = "sapo-printer"
version = "0.1.0"
description = "SAPO Printer - Clean Architecture Desktop Application"
authors = ["SAPO Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.2"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
chrono = "0.4"
regex = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
url = "2.5"
home = "0.5"

# PDF rendering
pdfium-render = { version = "0.9", features = ["thread_safe"] }

# Platform-specific secret management
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security", "Win32_Security_Credentials"] }
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.9"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = "3.0"

[target.'cfg(not(target_os = "windows"))'.dependencies]
cups-sys = "0.1"

[dev-dependencies]
mockito = "1.0"
filetime = "0.2"
